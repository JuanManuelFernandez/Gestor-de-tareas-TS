<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tareas</title>
  </head>
  <body>
    <div id="app">
        <h1 class="title">Gestor de Tareas</h1>
        <p class="subtitle">Organiza tu día</p>
        <form class="task-container" id="task-form">
          <input name="task" type="text" placeholder="Nueva tarea" id="task-input" required />
          <button type="submit" class="btnAgregar">Agregar</button>
        </form>
        <ul class="task-list" id="task-list">
        </ul>

        <p id="empty-message">No hay tareas pendientes</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
